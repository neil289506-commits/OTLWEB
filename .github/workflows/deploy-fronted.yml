name: Deploy Frontend to GitHub Pages

# 觸發時機：
#   1. push 到 main 分支且 frontend/ 目錄有變更時自動觸發
#   2. 也可以在 GitHub Actions 頁面手動觸發（workflow_dispatch）
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

# 讓 workflow 有權限寫入 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同時間只允許一個部署在跑，避免衝突
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取原始碼
        uses: actions/checkout@v4

      - name: 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 安裝依賴
        working-directory: frontend
        run: npm ci

      - name: TypeScript 型別檢查
        working-directory: frontend
        run: npm run typecheck

      - name: Build 前端靜態檔案
        working-directory: frontend
        run: npm run build

      - name: 設定 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上傳 build 產物
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
